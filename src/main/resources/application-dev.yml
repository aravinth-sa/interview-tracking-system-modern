spring:
  datasource:
    url: jdbc:h2:mem:its_db
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    defer-datasource-initialization: true  # wait for Hibernate to create tables BEFORE running data.sql

  # Flyway disabled in dev — Hibernate create-drop handles the schema,
  # and data.sql seeds the initial users
  flyway:
    enabled: false

  sql:
    init:
      mode: always   # tells Spring Boot to always run data.sql on startup

logging:
  level:
    com.wipro.its: DEBUG
    org.springframework.web: DEBUG
