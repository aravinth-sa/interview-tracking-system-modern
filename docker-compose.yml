version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: its-postgres
    environment:
      POSTGRES_DB: its_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - its-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: its-app
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/its_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: your-secret-key-must-be-at-least-256-bits-long-for-HS256-algorithm
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - its-network
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  its-network:
    driver: bridge
